<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#ffb5ab",
                    "primary-fixed-dim": "#4ae176",
                    "on-tertiary-fixed": "#410001",
                    "surface-variant": "#2d3449",
                    "on-secondary-fixed": "#001f26",
                    "secondary-container": "#03b5d3",
                    "on-surface": "#dae2fd",
                    "background": "#0b1326",
                    "secondary-fixed": "#acedff",
                    "secondary": "#4cd7f6",
                    "on-tertiary": "#60130d",
                    "tertiary-container": "#ff8b7c",
                    "surface-container-highest": "#2d3449",
                    "outline": "#869585",
                    "on-background": "#dae2fd",
                    "inverse-on-surface": "#283044",
                    "surface-bright": "#31394d",
                    "on-secondary-fixed-variant": "#004e5c",
                    "on-surface-variant": "#bccbb9",
                    "surface-container-high": "#222a3d",
                    "error-container": "#93000a",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed": "#002109",
                    "primary-container": "#22c55e",
                    "on-secondary-container": "#00424e",
                    "surface-container": "#171f33",
                    "on-primary-fixed-variant": "#005321",
                    "tertiary-fixed": "#ffdad5",
                    "surface": "#0b1326",
                    "on-error": "#690005",
                    "surface-tint": "#4ae176",
                    "error": "#ffb4ab",
                    "surface-container-lowest": "#060e20",
                    "inverse-primary": "#006e2f",
                    "on-secondary": "#003640",
                    "secondary-fixed-dim": "#4cd7f6",
                    "on-primary-container": "#004b1e",
                    "outline-variant": "#3d4a3d",
                    "inverse-surface": "#dae2fd",
                    "primary-fixed": "#6bff8f",
                    "on-primary": "#003915",
                    "on-tertiary-container": "#76231b",
                    "surface-container-low": "#131b2e",
                    "primary": "#4be277",
                    "surface-dim": "#0b1326",
                    "tertiary-fixed-dim": "#ffb4a9",
                    "on-tertiary-fixed-variant": "#7f2a21"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "4px",
                    "container_max_width": "1200px",
                    "touch_target": "44px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg": [
                            "Geist"
                    ],
                    "button-text": [
                            "Geist"
                    ],
                    "data-value": [
                            "Geist"
                    ],
                    "status-label": [
                            "Geist"
                    ],
                    "body-md": [
                            "Geist"
                    ]
            },
            "fontSize": {
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.04em",
                                    "fontWeight": "800"
                            }
                    ],
                    "button-text": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "600"
                            }
                    ],
                    "data-value": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "600"
                            }
                    ],
                    "status-label": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.1em",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0F172A;
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Decorative Grid Overlay -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center opacity-20">
<div class="w-[320px] h-[640px] border border-outline-variant grid grid-cols-10 grid-rows-20 gap-px bg-surface-container-lowest">
<!-- Simulated Tetris Pieces -->
<div class="col-start-4 row-start-15 col-span-2 row-span-2 bg-secondary opacity-50"></div>
<div class="col-start-7 row-start-18 col-span-4 row-span-1 bg-primary opacity-50"></div>
<div class="col-start-5 row-start-19 col-span-3 row-span-1 bg-error opacity-50"></div>
<div class="col-start-6 row-start-18 col-span-1 row-span-2 bg-error opacity-50"></div>
</div>
</div>
<!-- Main Content Container -->
<main class="z-10 flex flex-col items-center w-full max-w-md px-gutter space-y-12">
<!-- Header / Logo -->
<header class="text-center w-full">
<h1 class="font-headline-lg text-headline-lg text-primary drop-shadow-[0_0_12px_rgba(74,225,118,0.6)] uppercase tracking-widest mb-2">
                TETRIS SUPERVISOR
            </h1>
<p class="font-status-label text-status-label text-on-surface-variant uppercase tracking-widest">
                SYSTEM ID: ARCADE-04
            </p>
</header>
<!-- Navigation / Actions -->
<nav class="flex flex-col w-full space-y-4">
<button class="group w-full h-touch_target bg-surface border border-outline hover:border-primary hover:bg-primary transition-colors flex items-center justify-center space-x-3 rounded">
<span class="material-symbols-outlined text-primary group-hover:text-background" data-icon="play_arrow" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="font-button-text text-button-text text-primary group-hover:text-background uppercase tracking-widest">
                    START NEW GAME
                </span>
</button>
<button class="group w-full h-touch_target bg-surface border border-outline hover:border-primary hover:bg-primary transition-colors flex items-center justify-center space-x-3 rounded opacity-80">
<span class="material-symbols-outlined text-primary group-hover:text-background" data-icon="restore" data-weight="fill" style="font-variation-settings: 'FILL' 1;">restore</span>
<span class="font-button-text text-button-text text-primary group-hover:text-background uppercase tracking-widest">
                    RESUME
                </span>
</button>
<button class="group w-full h-touch_target bg-surface border border-outline hover:border-primary hover:bg-primary transition-colors flex items-center justify-center space-x-3 rounded">
<span class="material-symbols-outlined text-primary group-hover:text-background" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-button-text text-button-text text-primary group-hover:text-background uppercase tracking-widest">
                    SETTINGS
                </span>
</button>
<button class="group w-full h-touch_target bg-surface border border-outline hover:border-primary hover:bg-primary transition-colors flex items-center justify-center space-x-3 rounded">
<span class="material-symbols-outlined text-primary group-hover:text-background" data-icon="help" data-weight="fill" style="font-variation-settings: 'FILL' 1;">help</span>
<span class="font-button-text text-button-text text-primary group-hover:text-background uppercase tracking-widest">
                    HOW TO PLAY
                </span>
</button>
</nav>
<!-- System Status Footer -->
<div class="w-full mt-12 flex justify-between items-center border-t border-outline-variant pt-4">
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-primary drop-shadow-[0_0_4px_rgba(74,225,118,0.8)]"></div>
<span class="font-status-label text-status-label text-on-surface-variant uppercase">SYSTEM ONLINE</span>
</div>
<span class="font-status-label text-status-label text-on-surface-variant uppercase">v4.2.0</span>
</div>
</main>
</body></html>
