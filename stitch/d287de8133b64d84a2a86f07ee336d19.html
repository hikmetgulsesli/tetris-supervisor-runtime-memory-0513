<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined', sans-serif;
            font-size: 24px;
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/files/geist-sans-latin-400-normal.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/files/geist-sans-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/files/geist-sans-latin-700-normal.woff2') format('woff2');
            font-weight: 700;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/files/geist-sans-latin-800-normal.woff2') format('woff2');
            font-weight: 800;
        }
        body {
            font-family: 'Geist', sans-serif;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "tertiary": "#ffb5ab",
                            "primary-fixed-dim": "#4ae176",
                            "on-tertiary-fixed": "#410001",
                            "surface-variant": "#2d3449",
                            "on-secondary-fixed": "#001f26",
                            "secondary-container": "#03b5d3",
                            "on-surface": "#dae2fd",
                            "background": "#0b1326",
                            "secondary-fixed": "#acedff",
                            "secondary": "#4cd7f6",
                            "on-tertiary": "#60130d",
                            "tertiary-container": "#ff8b7c",
                            "surface-container-highest": "#2d3449",
                            "outline": "#869585",
                            "on-background": "#dae2fd",
                            "inverse-on-surface": "#283044",
                            "surface-bright": "#31394d",
                            "on-secondary-fixed-variant": "#004e5c",
                            "on-surface-variant": "#bccbb9",
                            "surface-container-high": "#222a3d",
                            "error-container": "#93000a",
                            "on-error-container": "#ffdad6",
                            "on-primary-fixed": "#002109",
                            "primary-container": "#22c55e",
                            "on-secondary-container": "#00424e",
                            "surface-container": "#171f33",
                            "on-primary-fixed-variant": "#005321",
                            "tertiary-fixed": "#ffdad5",
                            "surface": "#0b1326",
                            "on-error": "#690005",
                            "surface-tint": "#4ae176",
                            "error": "#ffb4ab",
                            "surface-container-lowest": "#060e20",
                            "inverse-primary": "#006e2f",
                            "on-secondary": "#003640",
                            "secondary-fixed-dim": "#4cd7f6",
                            "on-primary-container": "#004b1e",
                            "outline-variant": "#3d4a3d",
                            "inverse-surface": "#dae2fd",
                            "primary-fixed": "#6bff8f",
                            "on-primary": "#003915",
                            "on-tertiary-container": "#76231b",
                            "surface-container-low": "#131b2e",
                            "primary": "#4be277",
                            "surface-dim": "#0b1326",
                            "tertiary-fixed-dim": "#ffb4a9",
                            "on-tertiary-fixed-variant": "#7f2a21"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                    },
                    "spacing": {
                            "unit": "4px",
                            "container_max_width": "1200px",
                            "touch_target": "44px",
                            "gutter": "16px"
                    },
                    "fontFamily": {
                            "headline-lg": ["Geist"],
                            "button-text": ["Geist"],
                            "data-value": ["Geist"],
                            "status-label": ["Geist"],
                            "body-md": ["Geist"]
                    },
                    "fontSize": {
                            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                            "button-text": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                            "data-value": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                            "status-label": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Subtle Background Grid to simulate game well -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: linear-gradient(to right, #3d4a3d 1px, transparent 1px), linear-gradient(to bottom, #3d4a3d 1px, transparent 1px); background-size: 32px 32px;"></div>
<div class="z-10 w-full max-w-md px-gutter relative flex flex-col gap-8">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-error drop-shadow-[0_0_12px_rgba(255,180,171,0.6)] uppercase mb-2">GAME OVER</h1>
<p class="font-status-label text-status-label text-on-surface-variant uppercase tracking-[0.2em]">Session Terminated</p>
</div>
<!-- Stats Bento Box -->
<div class="grid grid-cols-2 gap-4">
<!-- Score Card (Span full width) -->
<div class="col-span-2 bg-surface-container border border-outline-variant p-6 relative overflow-hidden group">
<!-- New High Score Badge -->
<div class="absolute top-0 right-0 bg-secondary text-on-secondary font-status-label text-status-label px-3 py-1 rounded-bl-lg">
                    NEW HIGH SCORE!
                </div>
<div class="flex flex-col items-center justify-center gap-2">
<span class="font-status-label text-status-label text-on-surface-variant uppercase">Final Score</span>
<span class="font-headline-lg text-[48px] leading-[1] font-extrabold text-primary drop-shadow-[0_0_8px_rgba(75,226,119,0.5)]">42,069</span>
</div>
<!-- Status Bar Top -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
</div>
<!-- Lines Card -->
<div class="bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center gap-1 relative">
<span class="font-status-label text-status-label text-on-surface-variant uppercase">Lines</span>
<span class="font-data-value text-data-value text-on-surface">142</span>
<!-- Status Bar Top -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-variant"></div>
</div>
<!-- Level Card -->
<div class="bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center gap-1 relative">
<span class="font-status-label text-status-label text-on-surface-variant uppercase">Level</span>
<span class="font-data-value text-data-value text-on-surface">12</span>
<!-- Status Bar Top -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-variant"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 mt-4">
<!-- Primary Action -->
<button class="h-touch_target bg-primary/10 border border-primary text-primary font-button-text text-button-text uppercase tracking-wider hover:bg-primary hover:text-on-primary transition-all duration-200 flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">replay</span>
                PLAY AGAIN
            </button>
<!-- Secondary Actions Row -->
<div class="grid grid-cols-2 gap-4">
<button class="h-touch_target bg-transparent border border-outline-variant text-on-surface-variant font-button-text text-button-text uppercase tracking-wider hover:border-secondary hover:text-secondary transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">leaderboard</span>
                    LEADERBOARD
                </button>
<button class="h-touch_target bg-transparent border border-outline-variant text-on-surface-variant font-button-text text-button-text uppercase tracking-wider hover:border-surface-bright hover:text-on-surface transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">home</span>
                    MAIN MENU
                </button>
</div>
</div>
</div>
</body></html>
